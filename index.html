/* 조장과 모둠원 역할 / 공동 편집 / 단계별 출석 및 완료 */
.leader-check{margin:18px 0 2px;padding:17px;border-radius:13px;background:#edf5ff;border:1px solid #cbdaee;display:flex;align-items:flex-start;gap:13px;cursor:pointer}
.leader-check input{width:23px;height:23px;flex:none;margin:1px 0 0;accent-color:#285eab}
.leader-check span{display:block;line-height:1.45}
.leader-check small{display:block;color:#5c718c;font-weight:500;font-size:12px;margin-top:6px;line-height:1.5}
.member-leader{font-size:12px;color:#102c50;background:#f6d792;border-radius:100px;padding:5px 9px;vertical-align:middle;white-space:nowrap}
.member-role{background:#ffffff20;border:1px solid #ffffff48;border-radius:100px;padding:9px 13px;font-size:12px;color:#eaf3ff}
.lead-info{background:#ebf3ff;border-left:4px solid #285eab;border-radius:9px;padding:13px 15px;color:#254774;margin:13px 0 16px;font-size:14px;line-height:1.7}
.committee.chosen:disabled{opacity:1;cursor:default}.committee:disabled:not(.chosen){opacity:.53}
.draft-tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}.draft-tools button{font-size:13px}
.draft-editor{border:2px solid #a8c4e3;border-radius:13px;background:#f3f8ff;padding:13px;margin-top:8px}.draft-editor textarea{border-radius:8px;min-height:180px;background:white}
.fixed-article{display:flex;gap:6px;flex-direction:column;margin:0 4px 10px}.fixed-article small{font-size:11px;color:#617d9e}.fixed-article strong{font-size:21px;color:#225590}
.group-members{margin-top:13px;padding:12px;background:#f8fbff;border:1px solid #e0e9f4;border-radius:10px}
.member-subhead{font-size:12px!important;color:#536a86}.member-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.member-pill{display:inline-block;background:#e9eef5;border-radius:100px;padding:6px 9px;font-size:12px;font-weight:750;color:#45627e}
.member-pill.done{background:#d5f2df;color:#166c40}.member-pill.pending{background:#fff3d8;color:#946424}
.leader-manage{margin-top:10px}.leader-manage summary{font-size:11px;font-weight:750;color:#4f7196;cursor:pointer}.leader-manage select{margin-top:7px;font-size:12px;padding:8px}
.bill-compare,.motion-compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:12px 0}

.motion-compare{margin:10px 0 0}.motion-compare>div{min-width:0;text-align:left}.motion-compare span{font-size:12px;color:#c6dcf4;font-weight:800}.motion-compare .article{margin-top:5px;max-height:122px;white-space:pre-wrap;overflow:auto}.motion-new .article{border:1px solid #2b7857}.board-reason{text-align:left;font-size:12px;line-height:1.6;color:#c8dbed;margin:9px 0 0}

.gazette-explainer{border:1px solid #d5e4f0;background:#f2f8fd;padding:16px 19px;border-radius:14px;line-height:1.85;margin:15px 0 21px;font-size:14px;color:#2c4a6b}

.gazette-type{text-align:center;margin:28px 0 10px;letter-spacing:.25em;font-size:16px;font-weight:800;color:#234265}
.gazette-paper h3{margin:8px 0 19px;font-size:clamp(23px,3vw,33px);text-align:center;letter-spacing:.03em}
.gazette-declare{text-align:center;font-size:clamp(16px,2vw,20px);padding:14px 0;line-height:2}

.gazette-president{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:900}

.gazette-rule{border-bottom:2px solid #1b2b3b;margin:21px 0 24px}.gazette-paper h4{font-size:clamp(19px,2.3vw,23px);margin:20px 0 8px;text-align:center}
.gazette-clause{text-align:left;font-weight:900;font-size:18px;margin-bottom:4px}.gazette-article{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(15px,1.8vw,18px);line-height:2.15;padding:5px 0 20px}
.gazette-bottom{margin-top:30px;border-top:1px dashed #abacaa;padding-top:15px;font:13px/1.8 system-ui,'Malgun Gothic',sans-serif;color:#806b58;text-align:center}.gazette-bottom p{margin:4px 0}
.gazette-wait{border:2px dashed #c5d6e8;border-radius:16px;min-height:230px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:5px;padding:26px;background:#f8fbff}
.gazette-wait h3{color:#254770;font-size:22px;margin:10px 0 3px}.gazette-wait p{font-size:14px;color:#647791;line-height:1.7;max-width:530px;margin:3px}

    "original_note": "현행법에서 이 과제와 직접 관련된 조항의 원문을 발췌했어요. 전체 법률은 아래 링크에서 확인할 수 있어요."
  }
]</script>
<script>
'use strict';
const CASES=JSON.parse(document.getElementById('case-data').textContent);
// 국회운영위원회의 개정 대상은 제125조제6항으로 안내하고, 제5항은 참고용 원문으로 남긴다.
const operationCase=CASES.find(c=>c.committee==='국회운영위원회');if(operationCase)operationCase.article='제125조제6항';
const PHASES=['상임위원회 선택','기사와 법 조항 살펴보기','소관 위원회 개정안 만들기','법사위(법제사법위원회) 체계·자구 심사','법률안 최종 확정','본회의 · 제안 설명 및 표결','대통령 공포 · 모의 관보'];
const PHASE_NOTES=['각 모둠이 맡을 상임위원회를 정합니다.','관련 뉴스와 바꾸려는 실제 법 조항의 원문을 읽습니다.','원래 법률 조항을 읽고 바꾸고 싶은 본문과 이유를 작성합니다.','모든 위원회가 공통으로 법제사법위원회(법사위) 체계·자구 심사를 체험합니다.','위원회 의원별 최종 확인을 거쳐 위원장이 위원회 법률안을 확정하고, 본회의 안건 선정을 준비합니다.','발표할 법안을 선택하고 제안 설명을 들은 후 표결합니다.','본회의에서 통과된 법률안을 대통령 명의로 모의 공포하고, 관보에서 확인합니다.'];
const KEY='MOCK_PARLIAMENT_HIGH_50_V1'; // 기존 수업 기록을 그대로 이어 사용
const SID_KEY='MOCK_PARLIAMENT_HIGH_50_MEMBER_V1';
const MANUAL_PHASE_KEY='MOCK_PARLIAMENT_HIGH_50_MANUAL_PHASE_V1';
const FRESH=()=>({version:5,phase:0,phaseRevision:0,enrolled:30,groups:{},members:{},activeMotion:'',voteOpen:false,voteEnded:false,votes:{},closedMotions:{},promulgations:{},gazetteSelected:'',reconsiderations:{},reconsiderationActive:''});
let state=FRESH();
try{const prev=JSON.parse(localStorage.getItem(KEY)||'null');if(prev&&[3,4,5].includes(prev.version)){state=Object.assign(FRESH(),prev);state.version=5;state.phaseRevision??=0;state.promulgations??={};state.gazetteSelected??='';state.reconsiderations??={};state.reconsiderationActive??='';for(const g of Object.values(state.groups||{})){g.leaderId??='';g.memberDone??={1:{},2:{},3:{}};g.done??={};}}}catch(e){}
let sid=sessionStorage.getItem(SID_KEY)||'';
let tab='student';
const el=id=>document.getElementById(id);
const E=t=>String(t??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const show=x=>E(x);
const me=()=>state.members[sid]||null;
const myNum=()=>me()?.group||'';
const myGroup=()=>state.groups[myNum()]||null;
const getCase=id=>CASES.find(c=>c.id===id)||null;
// Display-only committee names: underlying group numbers / Supabase RPC IDs stay intact.
function confirmedCommitteeOf(no){
 const key=String(no??'').trim(),g=state.groups?.[key];
 if(!key||!g?.caseId||!(g.done?.[0]||state.phase>0))return '';
 return getCase(g.caseId)?.committee||'';
}
function groupLabel(no,showGroupNumber=false){
 const id=String(no??'').trim();if(!id)return '미선택';
 const committee=confirmedCommitteeOf(id);
 return committee?(showGroupNumber?`${committee} (${id}모둠)`:committee):`${id}모둠`;
}
// 확정 전 조장 → 소관 상임위원회 확정 후 위원장. 권한과 서버 ID는 그대로입니다.
function roleLabel(no){return confirmedCommitteeOf(no)?'위원장':'조장'}
function updateJoinRoleLabel(){
 const field=el('joinRepresentativeText'),no=el('joinGroup')?.value;
 if(!field||!no)return;
 const entryRoom=el('joinRoom')?.value?.trim().toUpperCase()||'';
 // 아직 방에 입장하지 않았다면 다른 수업 방의 직책을 표시하지 않습니다.
 const canIdentify=!!(cloudRoomReady&&entryRoom===cloudRoom);
 const chair=canIdentify&&roleLabel(no)==='위원장';
 field.textContent=chair?'저는 이 위원회의 위원장입니다':'저는 이 모둠의 조장입니다';
}

const myCase=()=>getCase(myGroup()?.caseId);
const allGroups=()=>Object.entries(state.groups).sort((a,b)=>Number(a[0])-Number(b[0]));
function cleanGroup(){return {leaderId:'',memberDone:{1:{},2:{},3:{}},caseId:'',idea:'',amend:'',reason:'',effect:'공포한 날부터',draftMethod:'replace',generatedFrom:'',reviewed:false,review:[],proposed:'',reviewMode:'',reviewChoice:'',submitted:false,done:{}}}
function ensureGroup(groupNum=myNum()){if(!state.groups[groupNum])state.groups[groupNum]=cleanGroup();return state.groups[groupNum]}
function uid(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'m-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14)}
function membersOf(groupNum){return Object.values(state.members).filter(m=>m.group===String(groupNum)).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}
function isLeader(){return !!(me()&&myGroup()?.leaderId===sid)}
function getLeader(groupNum){const g=state.groups[String(groupNum)];return g?.leaderId?state.members[g.leaderId]||null:null}
function marked(g,phase,id){return !!g?.memberDone?.[phase]?.[id]}
function clearMarked(g,phases){g.memberDone??={1:{},2:{},3:{}};for(const p of phases){g.memberDone[p]={};g.done[p]=false}}
function groupPhaseComplete(no,g,p){if(p===0)return !!(g.caseId&&g.done[0]);if(p===4)return !!g.submitted;if([1,2,3].includes(p)){const members=membersOf(no);return members.length>0&&members.every(m=>marked(g,p,m.id))}return !!g.submitted}
function memberPhaseProgress(no,g,p){const members=membersOf(no);const completed=members.filter(m=>marked(g,p,m.id));return {members,completed,rate:members.length?completed.length+'/'+members.length:'0/0'}}
function articleLabel(c){return c?.article||'개정할 조항'}
function originalBody(c){
 let text=String(c?.original||'').replace(/^제\d+조(?:의\d+)?\s*\([^\n)]*\)\s*/,'').trim();
 const target=String(c?.article||'');
 const item=target.match(/제(\d+)호/);
 if(item){const n=item[1],pattern=new RegExp('(?:^|\\n)'+n+'\\.\\s*');const found=text.search(pattern);if(found>=0){text=text.slice(found).replace(new RegExp('^\\n?'+n+'\\.\\s*'),'');const next=text.search(/\n\d+\.\s*/);if(next>=0)text=text.slice(0,next)}}
 else {let mark=target.includes('제6항')?'⑥':target.match(/제(\d+)항/)?.[1];if(mark&&/^[0-9]+$/.test(mark)){mark='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[Number(mark)-1]||''}if(mark&&text.includes(mark)){text=text.slice(text.indexOf(mark)+mark.length).trim();const next=text.search(/\n[①②③④⑤⑥⑦⑧⑨⑩]/);if(next>=0)text=text.slice(0,next)}}
 return text.trim();
}
function save(refresh=true){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('브라우저의 저장 공간에 접근할 수 없습니다.')}if(refresh)render()}
function switchTab(to){tab=to;el('student').classList.toggle('hidden',to!=='student');el('teacher').classList.toggle('hidden',to!=='teacher');el('btnStudent').classList.toggle('selected',to==='student');el('btnTeacher').classList.toggle('selected',to==='teacher');render()}
function logIn(){
 const number=Number(el('joinGroup')?.value||0),name=(el('joinName')?.value||'').trim().replace(/\s+/g,' '),wantsLead=!!el('joinLeader')?.checked;
 if(!(number>=1&&number<=30))return alert('모둠 번호를 1부터 30까지 선택해 주세요.');
 if(name.length<2||name.length>20)return alert('이름은 2~20글자로 입력해 주세요.');
 const no=String(number),group=ensureGroup(no);
 let id=Object.keys(state.members).find(x=>state.members[x].name===name&&state.members[x].group===no);
 if(!id)id=uid();
 if(wantsLead&&group.leaderId&&group.leaderId!==id){const old=getLeader(no);return alert(`${groupLabel(no,true)}의 ${roleLabel(no)}은 이미 ${old?.name||'다른 의원'} 의원입니다. 일반 의원으로 입장하거나 선생님에게 ${roleLabel(no)} 변경을 요청하세요.`)}
 state.members[id]={id,name,group:no};
 if(wantsLead)group.leaderId=id;
 sid=id;sessionStorage.setItem(SID_KEY,id);save();
}
function logOut(){if(!confirm('다른 의원으로 들어갈까요? 작성한 법안과 표결 기록은 남아 있습니다.'))return;sid='';sessionStorage.removeItem(SID_KEY);render()}
function legacyEntry(){return `<div class="join-wrapper"><div class="join-card"><span class="emblem">⚖ 대한민국 모의국회 · 의원 등록</span><h1>오늘은 여러분이<br>국회의원입니다!</h1><p>모둠 번호와 이름을 입력하면 의원으로 입장해요. <b>조장은 모둠의 상임위원회를 정하고 최종 법률안을 확정</b>합니다. 다른 의원들은 함께 법안을 만들고 각자 활동 완료를 표시해요.</p><div class="two"><div><label for="joinGroup">모둠 번호</label><select id="joinGroup" onchange="updateJoinRoleLabel()">${Array.from({length:30},(_,i)=>`<option value="${i+1}">${i+1}모둠</option>`).join('')}</select></div><div><label for="joinName">의원 이름</label><input id="joinName" maxlength="20" placeholder="예: 김민주" autocomplete="name" onkeydown="if(event.key==='Enter')logIn()"></div></div><label class="leader-check" for="joinLeader"><input id="joinLeader" type="checkbox"><span><b id="joinRepresentativeText">저는 이 모둠의 조장입니다</b><small>상임위원회 선택과 모둠 법률안 최종 확정을 맡아요. 위원회가 확정되면 ‘위원장’으로 표시돼요. 모둠마다 한 명만 선택할 수 있어요.</small></span></label><button style="width:100%;padding:16px;font-size:18px;margin-top:18px" onclick="logIn()">국회의원으로 입장하기 →</button><p class="tiny">이름을 다시 입력하지 않고 투표할 수 있어요. 현재 파일은 같은 브라우저에서만 공동 데이터가 공유되며, 실제 기기 간 동기화는 나중에 연결해야 합니다.</p></div></div>`}
function rails(){return `<div class="phase-rail">${PHASES.map((p,i)=>`<div class="step ${i<state.phase?'past':i===state.phase?'current':''}">${i+1}. ${E(p)}</div>`).join('')}</div>`}
function memberHeader(){const m=me(),c=myCase();return `<div class="member-bar"><div><small>대한민국 모의국회 · 의원 활동실</small><h2>${E(groupLabel(m.group))} ${E(m.name)} 의원님, 환영합니다! ${isLeader()?`<span class="member-leader">★ ${E(roleLabel(m.group))}</span>`:''}</h2><small>현재 단계: ${E(PHASES[studentPhase()])} · 소관 상임위원회: ${E(c?.committee||'아직 배정 전')}</small></div><span class="member-role">${isLeader()?`${E(roleLabel(m.group))} · ${confirmedCommitteeOf(m.group)?'소관 위원회 법률안 최종 확정':'상임위원회 선택과 최종 확정'}`:(confirmedCommitteeOf(m.group)?'위원회 의원':'모둠원')+' · 공동 작성과 개인별 활동 완료'}</span></div>`}
function stageDoneButton(p){
 const g=myGroup();if(p<0||p>4)return '';
 const role=E(roleLabel(myNum()));
 if(p===0&&!isLeader())return `<div class="complete"><div><strong>상임위원회 확정은 ${role}이 해요</strong><div class="tiny">${confirmedCommitteeOf(myNum())?'위원회 의원':'모둠원'}은 선택된 위원회를 확인하고, 다음 단계부터 각자 완료 표시를 할 수 있어요.</div></div><span class="chip ${g?.done?.[0]?'done':'wait'}">${g?.done?.[0]?`✓ ${role}이 확정했어요`:`${role} 선택 기다리는 중`}</span></div>`;
 const done=p===0?!!g?.done?.[0]:marked(g,p,sid);
 const msg=p===0?`${role}이 선택한 위원회를 확정하면 선생님이 확인합니다.`:p===4?`각자 소관 위원회의 최종 법률안을 확인하고 완료를 누르세요. 최종 확정은 ${role}이 합니다.`:(confirmedCommitteeOf(myNum())?'위원회 의원':'모둠원')+' 각자가 완료를 누르면 선생님 화면에 이름별로 표시돼요.';
 return `<div class="complete"><div><strong>${done?'✓ 완료 확인했어요':p===4?'최종 법률안을 확인했나요?':'이 활동을 마쳤나요?'}</strong><div class="tiny">${msg} 학급 전체 다음 단계는 교사가 이동합니다.</div></div><button class="${done?'outline':''}" ${done?'disabled':''} onclick="completeStage(${p})">${done?'✓ 완료 표시됨':'✓ '+(p===0?'위원회 선택 확정':p===4?'최종안 확인 완료':'내 활동 완료')}</button></div>`;
}
function completeStage(p){
 const g=myGroup();if(!g)return;
 if(p===0){if(!isLeader())return alert(`위원회 선택 확정은 ${roleLabel(myNum())}만 할 수 있어요.`);if(!g.caseId)return alert('먼저 상임위원회를 선택하세요.');g.done[0]=true;return save()}
 if(p===1&&!g.caseId)return alert(`선택된 상임위원회가 없습니다. 선생님이나 ${roleLabel(myNum())}에게 알려 주세요.`);
 if(p===2){if(!g.amend.trim()||!g.reason.trim())return alert('새로운 법률 본문과 바꾸는 이유를 작성해 주세요.');}
 if(p===3&&(!g.reviewed||!g.reviewChoice))return alert('자동 검토를 확인하고 「이대로 수정하기」 또는 「직접 수정하기」를 선택해 주세요.');
 if(p===4&&(!g.amend.trim()||!g.reason.trim()))return alert('법률안의 조문과 개정 이유를 먼저 확인해 주세요.');
 g.memberDone??={1:{},2:{},3:{},4:{}};g.memberDone[p]??={};g.memberDone[p][sid]=true;if(p<4)g.done[p]=groupPhaseComplete(myNum(),g,p);save();
}
function chooseCommittee(id){
 if(studentPhase()!==0)return;
 if(!isLeader())return alert(`상임위원회 선택은 ${roleLabel(myNum())}만 할 수 있어요.`);
 const k=myNum(),busy=allGroups().find(([no,g])=>no!==k&&g.caseId===id);
 if(busy)return alert(groupLabel(busy[0],true)+'에서 이미 이 상임위원회를 맡았습니다.');
 const g=ensureGroup();
 if(g.caseId!==id){state.groups[k]={...cleanGroup(),leaderId:g.leaderId,caseId:id}}
 save();
}
function legacyCommitteeScreen(){
 const g=myGroup(),blocked=allGroups().filter(([n,x])=>n!==myNum()&&x.caseId).map(([n,x])=>x.caseId),lead=isLeader(),role=E(roleLabel(myNum()));
 return `<div class="panel"><div class="spread"><h2>우리 모둠의 상임위원회 정하기</h2><span class="chip">총 17개</span></div><p class="intro">상임위원회는 국회에서 분야별 법안을 먼저 살펴보는 곳이에요. <b>${role}이 대표로 하나를 선택</b>하고, 다른 모둠이 고른 곳은 선택할 수 없어요.</p><div class="lead-info">${lead?(g?.done?.[0]?`★ ${role}님! 소관 상임위원회가 확정되었습니다.`:`★ ${role}님! 친구들과 의논한 뒤 위원회 하나를 선택해 주세요.`):`모둠원은 선택 결과를 확인하세요. ${getLeader(myNum())?`${role}: <b>${E(getLeader(myNum()).name)}</b> 의원`:`아직 ${role}이 정해지지 않았어요. 선생님께 알려 주세요.`}`}</div><div class="committees">${CASES.map(c=>{const occupied=blocked.includes(c.id),chosen=g?.caseId===c.id;return `<button class="committee ${chosen?'chosen':''}" onclick="chooseCommittee('${E(c.id)}')" ${occupied||!lead||!!g?.done?.[0]?'disabled':''}><strong>${E(c.committee)}</strong><small>${occupied?'다른 모둠이 선택했어요':chosen?'✓ 우리 모둠이 선택했어요':E(c.title)}</small></button>`}).join('')}</div>${g?.caseId?`<p class="intro" style="margin-top:14px"><b>선택한 위원회:</b> ${E(getCase(g.caseId)?.committee)}</p>`:''}${stageDoneButton(0)}</div>`;
}
function legacyOriginalBox(c,full=true){return `<div class="case-box"><div class="spread"><strong>📜 ${E(c.law)} ${E(c.article)} · 현행 조문 원문</strong><span class="chip">법률 원문 발췌</span></div><div class="law-raw" style="margin-top:12px">${E(c.original)}</div><p class="legal-note">${E(c.original_note||'')}</p>${full?`<div class="law-explain"><b>💬 쉽게 풀면?</b><div>${E(c.extract)}</div></div>`:''}</div>`}
function pressLinks(c){return `<div class="linkrow"><a href="${E(c.url)}" target="_blank" rel="noopener">↗ 관련 기사 원문 보기</a><a href="${E(c.lawurl)}" target="_blank" rel="noopener">↗ 법률 전문 보기 (선택)</a></div>`}

function checkText(original){let arr=[],proposed=original.trim();const add=(title,detail)=>arr.push({title,detail});if(!proposed){add('법률 문장이 비어 있어요','작성 단계의 문장을 먼저 적어 주세요.');return {arr,proposed:''}}if(/할수|해야한다|할수있다/.test(proposed)){proposed=proposed.replace(/할수있다/g,'할 수 있다').replace(/할수/g,'할 수').replace(/해야한다/g,'해야 한다');add('띄어쓰기를 정리했어요','‘할 수 있다’, ‘해야 한다’처럼 띄어 쓰는 것이 자연스러워요.')}if(/해\s*주세요|해줘요/.test(proposed)){proposed=proposed.replace(/해\s*주세요/g,'하도록 한다').replace(/해줘요/g,'하도록 한다');add('대화체 표현을 정리했어요','법률은 부탁하는 말보다 규칙을 정하는 말로 쓰는 것이 좋아요.')}if(!/[.]$/.test(proposed)){proposed=proposed.replace(/[?!。]$/,'');proposed+='.';add('마침표를 정리했어요','법률 문장은 보통 마침표로 끝나요.')}for(const word of ['적당히','가급적','웬만하면','충분히','빠른 시일 내','가능하면','필요한 경우','적절히'])if(original.includes(word))add('뜻이 모호할 수 있는 표현: '+word,'누가, 언제, 어떤 조건에서 적용할지 친구들과 더 정해 보세요. 이 부분은 자동으로 의미를 바꾸지 않았어요.');if(/해야 한다/.test(original)&&/할 수 있다/.test(original))add('선택인지 의무인지 확인해요','‘해야 한다’는 반드시, ‘할 수 있다’는 선택이 가능한 규칙이에요.');if(proposed.length>400)add('긴 문장입니다','하나의 문장에서 여러 규칙을 정하고 있는지 확인해 보세요.');if(arr.length===0)add('기본 표현 점검 완료','자동으로 발견한 문장 오류가 없어요. 원래 법률과 내용이 충돌하지 않는지는 직접 토론해 보세요.');return {arr,proposed}}

function voterBucket(id=state.activeMotion){return state.votes[id]||{}}
function cast(choice){const m=me();if(!m)return;if(!state.activeMotion||!motionGroup())return alert('교사가 상정한 법안이 없습니다.');if(!state.voteOpen||state.voteEnded)return alert('현재 표결 시간이 아닙니다.');if(!['찬성','반대','기권'].includes(choice))return;state.votes[state.activeMotion]||={};state.votes[state.activeMotion][m.id]={choice,name:m.name,group:m.group};save()}
function cancelVote(){if(!state.voteOpen)return alert('표결 시간이 끝나면 선택을 취소할 수 없어요.');delete state.votes[state.activeMotion]?.[sid];save()}
function countedVotes(id=state.activeMotion){return Object.values(voterBucket(id)).filter(v=>v&&['찬성','반대','기권'].includes(typeof v==='string'?v:v.choice)).map(v=>typeof v==='string'?{choice:v}:v)}

function studentVoteResultsBoard(kind,id){
 if(!id)return '';
 const second=kind==='revote';
 const members=Object.entries(state.members||{}).sort((a,b)=>Number(a[1].group)-Number(b[1].group)||a[1].name.localeCompare(b[1].name,'ko'));
 const ballot=second?(state.reconsiderations?.[id]?.votes||{}):(state.votes?.[id]||{});
 const entries=members.map(([uid,member])=>{
   const vote=ballot[uid];
   const choice=typeof vote==='string'?vote:(vote?.choice||'');
   const cls=choice==='찬성'?'yes':choice==='반대'?'no':choice==='기권'?'abs':'none';
   return `<div class="seat ${cls}" title="${E(groupLabel(member.group,true))} ${E(member.name)}: ${E(choice||'미투표')}"><span>${E(member.name)}</span><small>${E(choice||'대기')}</small></div>`;

function writingScreen(){const c=myCase(),g=myGroup();if(!c||!g)return '<div class="panel">법률안 작성 대상이 없습니다.</div>';return `<div class="panel"><div class="spread"><h2>${E(groupLabel(myNum()))} · 일부개정법률안 입안</h2><span class="chip">${E(articleLabel(c))} · 특정 조항 개정</span></div><p class="intro">현행법의 <b>규율 대상(누가), 적용 요건(언제), 법적 효과(무엇을)</b>를 검토한 뒤 필요한 문언을 수정하세요. 원문의 기본 체계를 유지해도 됩니다.</p>${originalBox(c)}<div class="lesson-legal-tip"><span>⚖</span><div><b>입안 과제</b><br>${E(c.task)}<br>개정으로 해결할 문제와 예상되는 영향이 일치하는지 점검하세요.</div></div><div class="draft-tools"><button class="soft" onclick="loadOriginalToDraft()" ${g.submitted?'disabled':''}>📋 현행 조문 불러와 수정하기</button></div><label for="amend">개정 조문 본문</label><div class="draft-editor"><div class="fixed-article"><strong>${E(articleLabel(c))}</strong></div><textarea id="amend" ${g.submitted?'disabled':''} placeholder="현행 조문의 표현을 살려 개정할 본문만 작성하세요." oninput="updateField('amend',this.value)">${E(g.amend)}</textarea></div><p class="tiny">조·항·호 표기는 자동 표시됩니다. 번호 대신 본문의 개정 내용에 집중하세요.</p><label for="reason">개정 이유 및 입법 취지</label><textarea id="reason" style="min-height:100px" ${g.submitted?'disabled':''} placeholder="현행 규정의 한계와 개정 시 기대되는 효과를 서술하세요." oninput="updateField('reason',this.value)">${E(g.reason)}</textarea><label for="effect">부칙: 시행일 선택</label><select id="effect" ${g.submitted?'disabled':''} onchange="updateField('effect',this.value)">${['공포한 날부터','공포 후 3개월','공포 후 6개월','공포 후 1년','공포 후 2년'].map(x=>`<option ${g.effect===x?'selected':''}>${E(x)}</option>`).join('')}</select><p class="tiny">시행일은 행정적 준비 기간이나 이해관계자의 적응 기간을 고려하여 결정할 수 있습니다.</p>${stageDoneButton(2)}</div>`}

function academicGlossary(){return `<details class="academic-glossary"><summary>📖 입법 활동 핵심 용어 · 누르면 뜻을 확인할 수 있습니다</summary><div class="glossary-list"><p><b>소관 상임위원회</b> 특정 분야의 법률안을 심사하는 국회 위원회</p><p><b>일부개정법률안</b> 법률 전체가 아니라 일부 조항을 개정하는 법률안</p><p><b>입법 취지</b> 법률을 개정하려는 목적과 근거</p><p><b>규율 대상·요건·효과</b> 누구에게 / 어떤 조건에서 / 무엇을 요구·허용하는지</p><p><b>법사위(법제사법위원회) 체계·자구 심사</b> 소관 상임위원회 심사와 구분하여 조문 간 정합성·문언의 정확성을 점검하는 절차</p><p><b>상정</b> 안건을 본회의의 심의·표결 대상으로 올리는 일</p><p><b>재적의원</b> 현재 의원으로 등록된 사람(수업에서는 교사가 입력한 학급 의원 수)</p><p><b>의결정족수</b> 의결이 성립하기 위해 필요한 출석 및 찬성 인원</p><p><b>부칙·시행일</b> 법률의 시행 시점 등을 정하는 규정</p><p><b>공포·관보</b> 법률을 공식적으로 알리는 절차 / 그 공고문이 실리는 매체</p><p><b>재의요구권</b> 대통령이 법률안에 이의가 있을 때 국회에 다시 심의·의결하도록 요구하는 권한(헌법 제53조)</p><p><b>재의결</b> 재의요구를 받은 법률안을 다시 표결하는 것. 재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성이 필요</p></div></details>`}

function decision(id=state.activeMotion){const z=tally(id),enrolled=Math.max(1,Number(state.enrolled)||1);if(z.total<Math.floor(enrolled/2)+1)return '의결정족수 미달 · 재적의원 과반수 미출석';return z.yes>z.total/2?'가결 · 출석의원 과반수 찬성':'부결 · 출석의원 과반수 찬성 미달'}

// 교사용 '의원별 최종안 확인'과 '조장 제출'을 독립적으로 관리·표시
function teacherSubmissionDashboard(isMiddle){
 const phase=isMiddle?2:4,rows=allGroups();
 const submitCount=rows.filter(([,g])=>!!g.submitted).length;
 const people=rows.flatMap(([no,g])=>membersOf(no).map(m=>({m,g})));
 const confirmCount=people.filter(({m,g})=>marked(g,phase,m.id)).length;
 const allChecked=rows.filter(([no,g])=>{const m=membersOf(no);return m.length>0&&m.every(x=>marked(g,phase,x.id))}).length;
 const head=isMiddle?'최종 법률안 확인 · 위원장 확정 현황':'최종안 확인 현황 · 위원회 확정 현황';
 const note=isMiddle?'의원은 법안을 읽고 「최종안 확인 완료」를 누릅니다. 위원장은 별도로 위원회 법률안을 최종 확정합니다.':'의원은 확정할 법률안을 읽고 「최종안 확인 완료」를 누릅니다. 개별 확인과 위원회의 최종 확정은 서로 다르며, 위원장이 최종 확정합니다.';
 return `<div class="panel submission-dashboard"><div class="spread"><h2>${head}</h2><span class="chip">현재 단계 · ${E(FLOW_LABELS[FLOW.indexOf(state.phase)]||'')}</span></div><div class="submission-note"><strong>개별 확인 ≠ 위원회 법률안 최종 확정</strong><br>${E(note)}</div><div class="submission-summary"><div class="submission-metric"><small>활동 모둠</small><b>${rows.length}</b></div><div class="submission-metric"><small>의원별 최종 확인</small><b>${confirmCount}<span style="font-size:16px"> / ${people.length}명</span></b></div><div class="submission-metric"><small>전원 확인한 모둠</small><b>${allChecked}<span style="font-size:16px"> / ${rows.length}</span></b></div><div class="submission-metric"><small>위원장이 최종 확정한 위원회</small><b>${submitCount}<span style="font-size:16px"> / ${rows.length}</span></b></div></div><div class="submission-grid">${rows.length?rows.map(([no,g])=>{
  const c=getCase(g.caseId),members=membersOf(no),completed=members.filter(m=>marked(g,phase,m.id));
  const leader=getLeader(no),pct=members.length?Math.round(completed.length/members.length*100):0;
  return `<div class="submission-card"><div class="submission-card-title"><div><b>${E(groupLabel(no,true))}</b><small>${E(c?.law||'상임위원회 배정 전')}</small></div><span class="submission-state ${g.submitted?'sent':''}">${g.submitted?'✓ 최종 확정 완료':`● ${E(roleLabel(no))} 확정 대기`}</span></div><div class="submission-section"><div class="submission-section-top"><strong>① 의원별 최종안 확인</strong><b>${completed.length} / ${members.length}명</b></div><div class="submission-track"><div class="submission-fill" style="width:${pct}%"></div></div><div class="submission-members">${members.length?members.map(m=>`<span class="submission-member ${marked(g,phase,m.id)?'confirmed':''}">${leader?.id===m.id?`★ ${E(roleLabel(no))} `:''}${E(m.name)} · ${marked(g,phase,m.id)?'확인 완료':'미확인'}</span>`).join(''):'<span class="submission-member">등록된 의원 없음</span>'}</div></div><div class="submission-section"><div class="submission-section-top"><strong>② ${E(roleLabel(no))}의 위원회 법률안 최종 확정</strong></div><div class="submission-submit"><span>담당 ${E(roleLabel(no))}: <b>${E(leader?.name||'미지정')} 의원</b></span><span class="submission-state ${g.submitted?'sent':''}">${g.submitted?'확정 완료':'확정 전'}</span></div></div>${g.amend?`<details class="submission-details"><summary>법률안 원문·개정안 보기</summary><div class="pre">${E(artifact(g))}</div></details>`:''}</div>`;
 }).join(''):'<div class="small-warn">아직 입장한 모둠이 없어요. 학생이 입장하면 최종 확인과 확정 현황이 각각 나타납니다.</div>'}</div></div>`;
}

function teacherWork(){return state.phase===4?teacherSubmissionDashboard(false):legacyTeacherWork()}


// ===== 고등학교 선택형 대통령 재의요구·재의결 (헌법 제53조) =====
// 고등학생 기본 50분 과정의 7단계에만 선택형 절차를 추가합니다.
// 최초 본회의 투표와 재의결 투표는 서로 다른 객체에 보관합니다.
function reconsiderOf(id){return state.reconsiderations?.[String(id)]||null}
function activeReconsiderationVoting(){return Object.entries(state.reconsiderations||{}).find(([,r])=>r.status==='voting')?.[0]||''}
function cannotPromulgateReason(id){
 if(!state.groups[id]?.submitted)return '확정된 위원회 법률안이 없습니다.';
 if(!state.closedMotions[id])return '먼저 최초 본회의 표결을 마쳐야 합니다.';
 if(!isPassed(id))return '본회의에서 가결되지 않아 공포할 수 없습니다.';
 if(state.promulgations[id])return '이미 모의 공포한 법률입니다.';
 const r=reconsiderOf(id);
 if(r&&r.status!=='passed')return r.status==='failed'?'국회의 재의결에 실패하여 폐기된 법률안입니다.':'재의요구를 받았으므로 재의결에 성공하기 전에는 공포할 수 없습니다.';
 return '';
}
function canPromulgate(id){return !cannotPromulgateReason(id)}
function revoteTally(id){
 const r=reconsiderOf(id),votes=Object.values(r?.votes||{}).filter(v=>v&&['찬성','반대','기권'].includes(v.choice));
 return {total:votes.length,yes:votes.filter(v=>v.choice==='찬성').length,no:votes.filter(v=>v.choice==='반대').length,abs:votes.filter(v=>v.choice==='기권').length};
}
function revoteThreshold(id){
 const r=reconsiderOf(id),counts=revoteTally(id),enrolled=Math.max(1,Number(r?.enrolledAtVote||state.enrolled)||1);
 return {...counts,enrolled,attendanceMin:Math.floor(enrolled/2)+1,yesMin:Math.ceil(counts.total*2/3)};
}
function revoteDecision(id){
 const t=revoteThreshold(id);
 if(t.total<t.attendanceMin)return {type:'quorum',title:'재의결 불성립 · 출석 정족수 미달',explanation:'재적의원 과반수가 출석하지 않아 이번 표결로 법률안이 확정되지 않았습니다. 수업에서는 재표결을 다시 열 수 있습니다.'};
 if(t.yes>=t.yesMin)return {type:'passed',title:'재의결 성공 · 법률로 확정',explanation:`출석의원 ${t.total}명 중 ${t.yes}명이 찬성하여 출석의원 3분의 2 이상 찬성 요건을 충족했습니다. 공포 절차를 진행할 수 있습니다.`};
 return {type:'failed',title:'재의결 부결 · 법률안 폐기',explanation:`출석의원 ${t.total}명 중 찬성 ${t.yes}명으로, 필요한 ${t.yesMin}명에 미치지 못했습니다.`};
}
function lawStatus(id){
 if(!state.closedMotions[id])return '최초 본회의 표결 전';
 if(!isPassed(id))return '본회의 부결 · 공포 불가';
 if(state.promulgations[id])return '대통령 공포 완료';
 const r=reconsiderOf(id);
 if(!r)return '본회의 가결 · 공포 또는 재의요구 선택';
 return {requested:'대통령 재의요구 · 재표결 대기',voting:'국회 재의결 전자표결 중',passed:'재의결 성공 · 공포 대기',failed:'재의결 부결 · 법률안 폐기',quorum:'정족수 미달 · 재표결 가능'}[r.status]||'상태 확인 필요';
}
function setGazetteSelection(id){
 if(activeReconsiderationVoting())return alert('진행 중인 재표결부터 종료해 주세요.');
 if(id&&!state.groups[id]?.submitted)return alert('최종 확정된 모둠 법률안을 선택해 주세요.');
 state.gazetteSelected=id;
 state.reconsiderationActive=reconsiderOf(id)?id:'';
 save();
}
function requestReconsideration(id){
 if(state.phase!==6)return alert('대통령 공포·재의요구 단계에서 선택할 수 있습니다.');
 if(activeReconsiderationVoting())return alert('진행 중인 재표결부터 종료해 주세요.');
 if(!state.closedMotions[id]||!isPassed(id))return alert('최초 본회의에서 가결된 법률안만 재의를 요구할 수 있습니다.');
 if(state.promulgations[id])return alert('이미 공포한 법률에는 재의를 요구할 수 없습니다.');
 if(reconsiderOf(id))return alert('이미 이 법률안에 재의요구를 했습니다.');
 const c=getCase(state.groups[id].caseId);
 if(!confirm(`대통령이 ${groupLabel(id,true)}의 「${c?.law||'법률'} 일부개정법률안」 전체에 대해 재의를 요구할까요?\n\n재의요구 뒤에는 원안 그대로 국회에서 재표결해야 합니다.`))return;

 if(role==='teacher'&&!cloudTeacherAuthorized){alert('교사 비밀번호 인증이 필요합니다.');return null;}
 if(options.flush!==false&&action!=='edit_field'&&role==='student'){
  const saved=await cloudFlushDrafts();if(!saved)return null;
 }
 cloudBusyCount++;
 if(!options.silent)cloudStatusUpdate('syncing','서버에 저장 중…');
 try{
  const {data,error}=await client.rpc('mocklaw_command',{p_room:cloudRoom,p_action:action,p_data:payload});
  if(error)throw error;
  cloudRoomReady=true;cloudLastOk=Date.now();
  if(Number(data?.revision)>cloudRevision){
   // API 응답도 서버에서 확정된 결과입니다.
   if(options.immediate){
    cloudRevision=Number(data.revision);state=data.state;state.phaseRevision??=0;
    cloudPendingSnapshot=null;render();
   }else cloudApply(data,false);
  }
  if(!options.silent)cloudStatusUpdate('online','서버 저장 확인 · '+cloudRoom);
  return data;
 }catch(error){
  cloudAlertError(error);
  return null;
 }finally{
  cloudBusyCount--;

 }
}

function cloudStartPolling(){

 cloudSyncTimer=setInterval(()=>{
  if(!cloudRoomReady)return;

  if(document.visibilityState==='visible'&&!cloudIsTyping()&&!cloudDirty)cloudFetch();
 },8000);
}
function cloudStopRealtime(){
 if(cloudChannel&&cloudRealtimeClient){try{cloudRealtimeClient.removeChannel(cloudChannel);}catch(e){}}
 cloudChannel=null;cloudSubscriptionRoom='';cloudRealtimeClient=null;
 if(cloudReconnectTimer)clearTimeout(cloudReconnectTimer);
 cloudReconnectTimer=null;
}
function cloudStartRealtime(){
 const targetClient=(tab==='teacher'&&cloudTeacherAuthorized)?cloudTeacher:cloudStudent;
 if(!targetClient||!cloudRoom||!cloudRoomReady)return;
 if(cloudChannel&&cloudSubscriptionRoom===cloudRoom&&cloudRealtimeClient===targetClient)return;
 cloudStopRealtime();
 cloudSubscriptionRoom=cloudRoom;cloudRealtimeClient=targetClient;
 const channel=targetClient.channel('mocklaw-room-'+cloudRoom+'-'+Date.now());
 channel.on('postgres_changes',{event:'*',schema:'public',table:'mocklaw_rooms',filter:'room_code=eq.'+cloudRoom},payload=>{
  if(payload.new&&Number(payload.new.revision)<=cloudRevision)return;
  // 서버 최신 상태를 다시 읽어 적용: 이벤트가 누락돼도 주기적 재조회로 복구 가능.
  cloudFetch();
 });
 channel.subscribe(status=>{
  if(status==='SUBSCRIBED'){
    cloudStatusUpdate('online','실시간 연결됨 · '+cloudRoom);
    cloudFetch();
  }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
    cloudStatusUpdate('offline','실시간 재연결 중 · 자동 동기화 보정');
    if(!cloudReconnectTimer){
      cloudReconnectTimer=setTimeout(()=>{cloudReconnectTimer=null;cloudStopRealtime();if(cloudRoomReady)cloudStartRealtime();cloudFetch();},3500);
    }
  }
 });
 cloudChannel=channel;
}

updateField=function(field,value){
 if(!CLOUD_FIELDS.has(field)||!me())return;
 const g=myGroup();if(!g||g.submitted)return;
 const key=myNum()+':'+field;
 if(!cloudDrafts.has(key))cloudDrafts.set(key,{group:myNum(),field,expected:Number(g.fieldVersions?.[field]||0),saved:String(g[field]??''),desired:String(value),timer:null,inflight:null,failed:false});
 const b=cloudDrafts.get(key);b.desired=String(value);b.failed=false;
 g[field]=String(value);clearMarked(g,[2,3,4]);g.reviewed=false;g.review=[];g.reviewChoice='';g.proposed='';
 cloudDirty=true;cloudStatusUpdate('syncing','작성 중 · 자동 저장 준비');
 if(b.timer)clearTimeout(b.timer);
 b.timer=setTimeout(()=>cloudFlushDraft(key),800);
};
async function cloudFlushDraft(key){
 const b=cloudDrafts.get(key);if(!b)return true;
 if(b.timer){clearTimeout(b.timer);b.timer=null;}
 if(b.inflight){await b.inflight;if(b.failed)return false;}
 if(b.desired===b.saved){cloudDirty=[...cloudDrafts.values()].some(d=>d.desired!==d.saved);return true;}
 const textToSave=b.desired;
 b.inflight=(async()=>{
  const reply=await cloudCmd('edit_field',{field:b.field,value:textToSave,expected:b.expected},'student',{silent:true,flush:false});
  if(!reply){b.failed=true;return false;}
  b.expected=Number(reply.state.groups?.[b.group]?.fieldVersions?.[b.field]??b.expected+1);
  b.saved=textToSave;b.failed=false;return true;
 })();
 const ok=await b.inflight;b.inflight=null;
 cloudDirty=[...cloudDrafts.values()].some(d=>d.desired!==d.saved||d.failed);
 if(!ok){cloudStatusUpdate('offline','작성 내용 저장 실패 · 확인 필요');return false;}
 if(b.desired!==textToSave){b.timer=setTimeout(()=>cloudFlushDraft(key),400);}
 else if(!cloudDirty&&!cloudIsTyping()){
  if(cloudPendingSnapshot)cloudApply(cloudPendingSnapshot,true);
  else cloudFetch();
 }
 cloudStatusUpdate('online','작성 내용 서버 저장됨 · '+cloudRoom);
 return true;
}
async function cloudFlushDrafts(){

 return true;
}

teacherStep=async function(delta){
 const from=state.phase,to=from+delta;
 if(to<0||to>6)return;
 if(delta<0){
  const warning=to<=4?'해당 단계의 개인별 완료 기록이 해제되고, 이후 표결·재의요구·관보 기록이 있다면 취소됩니다. 작성한 법률 본문은 보존됩니다.':'재표결·공포 기록과 이전 본회의 표결 기록이 초기화됩니다.';
  if(!confirm(`${to+1}단계 「${PHASES[to]}」로 돌아갈까요?\n\n${warning}\n\n학생들이 그 단계를 다시 수행할 수 있습니다.`))return;
 }else if(from<=4){
  const notDone=allGroups().filter(([no,g])=>!groupPhaseComplete(no,g,from));
  if(notDone.length&&!confirm('아직 '+notDone.map(([no])=>groupLabel(no,true)).join(', ')+'이 현재 단계를 완료하지 않았습니다. 그래도 이동할까요?'))return;
 }else if(from===5&&state.voteOpen&&!confirm('진행 중인 표결을 종료하고 공포 단계로 갈까요?'))return;
 const result=await cloudCmd('teacher_step',{delta},'teacher',{immediate:true});
 if(result)cloudApply(result,true);
};

 const current=studentPhase();if(!me()||direction>0&&current>=6)return;

  sessionStorage.setItem(MANUAL_PHASE_KEY,JSON.stringify({phase:current+1,baseRevision:state.phaseRevision||0}));
  syncNotice='구두 지시에 따라 이 기기의 화면만 임시 이동했습니다. 서버에 저장하려면 교사의 실제 단계 이동이 완료되어야 합니다.';

 }
 renderStudent();
};

// MOCKLAW_SPEECH_TIMER_SLOT_V2
// Teacher starts, pauses, resumes and resets a 60s timer using room-scoped Realtime Broadcast.
// Student sees a read-only clock within the existing proposal speech panel.
// The server schema, original vote RPC, and original teacher dashboard remain untouched.
const SPEECH_DURATION_MS=60000;
const SPEECH_DONE='\uBC1C\uC5B8 \uC2DC\uAC04\uC774 \uC885\uB8CC\uB418\uC5C8\uC2B5\uB2C8\uB2E4.';
let speechState=null,speechChannel=null,speechChannelRoom='',speechChannelClient=null,speechConnected=false;
function speechCacheKey(){return 'mocklaw_speech_v1_'+cloudRoom;}
function speechStore(){
 if(!cloudRoom||!speechState)return;
 try{localStorage.setItem(speechCacheKey(),JSON.stringify(speechState));}catch(e){}
}
function speechRestore(){
 speechState=null;
 if(!cloudRoom)return;
 try{
  const value=JSON.parse(localStorage.getItem(speechCacheKey())||'null');
  if(value&&value.room===cloudRoom&&Number.isFinite(Number(value.seq)))speechState=value;
 }catch(e){}
}
function speechCurrent(){
 return cloudRoomReady&&state.phase===5&&!state.voteOpen&&!state.voteEnded&&
        speechState&&speechState.room===cloudRoom&&String(speechState.motion)===String(state.activeMotion)?speechState:null;
}
function speechStatus(){
 const x=speechCurrent();
 if(!x||x.mode==='ready')return {seconds:60,mode:'ready',remainingMs:SPEECH_DURATION_MS};
 if(x.mode==='paused'){
  const remainingMs=Math.max(0,Math.min(SPEECH_DURATION_MS,Number(x.remainingMs)||0));
  return {seconds:Math.ceil(remainingMs/1000),mode:remainingMs>0?'paused':'ended',remainingMs};
 }
 const remainingMs=Math.max(0,Math.min(SPEECH_DURATION_MS,Number(x.until)-Date.now()));
 return {seconds:Math.ceil(remainingMs/1000),mode:remainingMs>0?'running':'ended',remainingMs};
}
function speechClockString(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function speechTimerHtml(role){
 const z=speechStatus();
 const title=role==='teacher'?'\uC81C\uC548 \uC124\uBA85 \uC2DC\uAC04':'\uB0A8\uC740 \uBC1C\uC5B8 \uC2DC\uAC04';
 const info=z.mode==='ended'?SPEECH_DONE:z.mode==='paused'?'\uC77C\uC2DC\uC815\uC9C0\uB428':z.mode==='running'?'\uBC1C\uC5B8 \uC9C4\uD589 \uC911':'\uAD50\uC0AC\uC758 \uC2DC\uC791\uC744 \uB300\uAE30\uD569\uB2C8\uB2E4';
 return `<div class="speech-timer ${role} ${z.mode}" data-speech-clock="${role}" aria-live="polite"><div class="speech-timer-label">${title} \u00B7 1\uBD84</div><div class="speech-timer-time">${speechClockString(z.seconds)}</div><div class="speech-timer-state">${info}</div></div>`;
}
function speechControlsHtml(){
 return `<span class="speech-timer-controls" aria-label="\uC81C\uC548 \uC124\uBA85 \uD0C0\uC774\uBA38 \uC870\uC791">
 <button type="button" class="soft" data-speech-action="start" onclick="speechStart()">\u25B6 1\uBD84 \uC2DC\uC791</button>
 <button type="button" class="outline" data-speech-action="pause" onclick="speechPause()">\u23F8 \uC77C\uC2DC\uC815\uC9C0</button>
 <button type="button" class="outline" data-speech-action="reset" onclick="speechReset()">\u21BA \uCD08\uAE30\uD654</button>
 </span>`;
}
function speechTick(){
 const z=speechStatus();
 document.querySelectorAll('[data-speech-clock]').forEach(n=>{
  const v=n.querySelector('.speech-timer-time'),info=n.querySelector('.speech-timer-state');
  if(v)v.textContent=speechClockString(z.seconds);
  if(info)info.textContent=z.mode==='ended'?SPEECH_DONE:z.mode==='paused'?'\uC77C\uC2DC\uC815\uC9C0\uB428':z.mode==='running'?'\uBC1C\uC5B8 \uC9C4\uD589 \uC911':'\uAD50\uC0AC\uC758 \uC2DC\uC791\uC744 \uB300\uAE30\uD569\uB2C8\uB2E4';
  n.classList.toggle('running',z.mode==='running');n.classList.toggle('paused',z.mode==='paused');n.classList.toggle('ended',z.mode==='ended');
 });
 const active=!!(cloudTeacherAuthorized&&state.phase===5&&!state.voteOpen&&!state.voteEnded&&state.activeMotion);
 document.querySelectorAll('[data-speech-action]').forEach(b=>{
  const action=b.dataset.speechAction;
  b.disabled=!active||(action==='pause'&&z.mode!=='running')||(action==='start'&&z.mode==='running');
  if(action==='start')b.textContent=z.mode==='paused'?'\u25B6 \uC7AC\uAC1C':z.mode==='ended'?'\u21BA 1\uBD84 \uB2E4\uC2DC \uC2DC\uC791':'\u25B6 1\uBD84 \uC2DC\uC791';
 });
}
function speechClose(){
 if(speechChannel&&speechChannelClient){try{speechChannelClient.removeChannel(speechChannel);}catch(e){}}
 speechChannel=null;speechChannelRoom='';speechChannelClient=null;speechConnected=false;
}
function speechReceive(msg){
 const p=msg?.payload;if(!p||p.room!==cloudRoom||!['ready','running','paused'].includes(p.mode))return;
 const seq=Number(p.seq),motion=String(p.motion||'');if(!Number.isFinite(seq)||!motion)return;
 if(speechState&&speechState.room===cloudRoom&&Number(speechState.seq)>seq)return;
 if(speechState&&speechState.room===cloudRoom&&Number(speechState.seq)===seq&&speechState.motion!==motion)return;
 let remainingMs;
 if(p.mode==='running')remainingMs=Math.max(0,Math.min(SPEECH_DURATION_MS,Number(p.until)-Number(p.sentAt)));
 else if(p.mode==='paused')remainingMs=Math.max(0,Math.min(SPEECH_DURATION_MS,Number(p.remainingMs)));
 else remainingMs=SPEECH_DURATION_MS;
 if(!Number.isFinite(remainingMs))return;
 speechState={room:cloudRoom,motion,mode:p.mode,remainingMs:p.mode==='paused'?remainingMs:SPEECH_DURATION_MS,
              until:p.mode==='running'?Date.now()+remainingMs:0,seq};
 speechStore();speechTick();
}
async function speechSend(){
 if(!speechConnected||!speechChannel||!speechState||speechState.room!==cloudRoom)return false;
 try{return (await speechChannel.send({type:'broadcast',event:'speech_sync',payload:{...speechState,sentAt:Date.now()}}))==='ok';}
 catch(e){console.warn('Speech timer broadcast failed',e);return false;}
}
function speechEnsureChannel(){
 if(!cloudRoomReady||!cloudRoom||!cloudStudent)return;
 if(speechChannel&&speechChannelRoom===cloudRoom)return;
 speechClose();speechChannelRoom=cloudRoom;speechChannelClient=cloudStudent;
 const ch=cloudStudent.channel('mocklaw-speech-'+cloudRoom,{config:{broadcast:{self:false,ack:true}}});
 speechChannel=ch;
 ch.on('broadcast',{event:'speech_sync'},speechReceive);
 ch.on('broadcast',{event:'speech_request'},msg=>{
  if(cloudTeacherAuthorized&&msg?.payload?.room===cloudRoom&&speechState?.room===cloudRoom)speechSend();
 });
 ch.subscribe(status=>{
  if(speechChannel!==ch)return;
  speechConnected=status==='SUBSCRIBED';
  if(speechConnected){
   if(cloudTeacherAuthorized&&speechState?.room===cloudRoom)speechSend();
   else ch.send({type:'broadcast',event:'speech_request',payload:{room:cloudRoom}}).catch(()=>{});
  }
 });
}
function speechSet(mode,remainingMs){
 if(!cloudTeacherAuthorized||state.phase!==5||state.voteOpen||state.voteEnded||!state.activeMotion)return false;
 if(!speechConnected){speechEnsureChannel();alert('\uD0C0\uC774\uBA38 \uB3D9\uAE30\uD654 \uC5F0\uACB0\uC744 \uD655\uC778\uD55C \uD6C4 \uB2E4\uC2DC \uB20C\uB7EC \uC8FC\uC138\uC694.');return false;}
 const ms=Math.max(0,Math.min(SPEECH_DURATION_MS,remainingMs??SPEECH_DURATION_MS));
 speechState={room:cloudRoom,motion:String(state.activeMotion),mode,until:mode==='running'?Date.now()+ms:0,
              remainingMs:mode==='paused'?ms:SPEECH_DURATION_MS,seq:Math.max(Date.now(),Number(speechState?.seq||0)+1)};
 speechStore();speechSend().then(ok=>{if(!ok)console.warn('Speech timer connection needs a retry.');});
 speechTick();return true;
}
function speechStart(){
 const old=speechCurrent(),z=speechStatus();
 const ms=old?.mode==='paused'&&z.remainingMs>0?z.remainingMs:SPEECH_DURATION_MS;
 speechSet('running',ms);
}
function speechPause(){
 const x=speechCurrent(),z=speechStatus();
 if(!x||z.mode!=='running')return;
 speechSet('paused',z.remainingMs);
}
function speechReset(){speechSet('ready',SPEECH_DURATION_MS);}
function speechAutoClear(){
 if(!cloudTeacherAuthorized||!cloudRoom||!speechConnected)return;
 speechState={room:cloudRoom,motion:String(state.activeMotion),mode:'ready',until:0,remainingMs:SPEECH_DURATION_MS,
              seq:Math.max(Date.now(),Number(speechState?.seq||0)+1)};
 speechStore();speechSend();speechTick();
}
const speechOldSetRoom=cloudSetRoom;
cloudSetRoom=function(v){
 const old=cloudRoom,ok=speechOldSetRoom(v);
 if(ok&&old!==cloudRoom){speechClose();speechRestore();}
 return ok;
};
const speechOldStartRealtime=cloudStartRealtime;
cloudStartRealtime=function(){speechOldStartRealtime();speechEnsureChannel();};
const speechOldSetMotion=teacherSetMotion;
teacherSetMotion=async function(no){
 const old=state.activeMotion;
 await speechOldSetMotion(no);
 if(state.activeMotion!==old&&state.phase===5&&cloudTeacherAuthorized&&state.activeMotion)speechAutoClear();
};
const speechOldNextMotion=nextUnvotedMotion;
nextUnvotedMotion=async function(){
 const old=state.activeMotion;
 await speechOldNextMotion();
 if(state.activeMotion!==old&&state.phase===5&&cloudTeacherAuthorized&&state.activeMotion)speechAutoClear();
};
const speechOldStartVote=startVote;
startVote=async function(){await speechOldStartVote();if(state.voteOpen)speechAutoClear();};
// Preserve the original teacher board and all its bill/vote information.
// Only exchange the seat-name area with the timer before voting begins.
const speechOldBoardHtml=boardHtml;
boardHtml=function(){
 const html=speechOldBoardHtml();
 if(state.phase!==5)return html;
 const before=!!(state.activeMotion&&!state.voteOpen&&!state.voteEnded);
 // Preserve the original board header, current bill, totals, verdict, and legend unchanged.
 let result=html.replace('<div class="board">','<div class="board plenary-voting-board'+(before?' board-speech-before':'')+'">')
                .replace('<div class="seatgrid">','<div class="seatgrid plenary-member-vote-area">');
 if(before)result=result.replace('<div class="seatgrid plenary-member-vote-area">',speechTimerHtml('teacher')+'<div class="seatgrid plenary-member-vote-area">');
 return result;
};
// Keep the original proposal speech heading and place the timer immediately below it.
const speechOldStudentPlenary=studentPlenary;
studentPlenary=function(){
 const html=speechOldStudentPlenary();
 if(state.phase!==5||!state.activeMotion||state.voteOpen||state.voteEnded)return html;
 return html.replace('<p class="ballot-question">',speechTimerHtml('student')+'<p class="ballot-question">');
};
// Keep the original teacher controls; place timer buttons next to its vote-start button.
const speechOldTeacherPlenary=teacherPlenary;
teacherPlenary=function(){
 const html=speechOldTeacherPlenary();
 if(state.phase!==5||state.voteOpen||state.voteEnded)return html;
 return html.replace('<button onclick="startVote()"',speechControlsHtml()+'<button onclick="startVote()"');
};
// Ticking updates the clock without rebuilding student text inputs or moving scroll.
setInterval(speechTick,250);
setInterval(()=>{
 if(cloudTeacherAuthorized&&speechConnected&&state.phase===5&&!state.voteOpen&&!state.voteEnded&&speechCurrent())speechSend();
},2500);

render();
cloudInit();
